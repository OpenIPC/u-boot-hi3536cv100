name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        soc: [hi3536cv100]

    steps:
      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g:i386 libc6:i386 libstdc++6:i386

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: arm-hisiv600-linux-v1

      - name: Download toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -R OpenIPC/toolchains \
            -p 'arm-hisiv600-linux.tgz'
          mkdir -p toolchain
          tar xzf arm-hisiv600-linux.tgz -C toolchain
          if [ -f toolchain/arm-hisiv600-linux/arm-hisiv600-linux.tar.bz2 ]; then
            tar xjf toolchain/arm-hisiv600-linux/arm-hisiv600-linux.tar.bz2 \
                -C toolchain
          fi
          rm arm-hisiv600-linux.tgz
          # vendor uses short prefix `arm-hisiv600-linux-`; bin/ ships
          # gnueabi-suffixed binaries. Same short-name symlink dance the
          # rest of the OpenIPC u-boot fleet does.
          cd toolchain/arm-hisiv600-linux/bin
          for f in arm-hisiv600-linux-gnueabi-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/-gnueabi/}"
          done

      - name: Build
        run: |
          export PATH="$PWD/toolchain/arm-hisiv600-linux/bin:$PATH"
          # hi3536c has no compressed/ subdir (no mini-boot LZMA
          # wrapper). Vendor flow is u-boot.bin + mkboot.sh dd dance:
          # bytes [0..63] of u-boot.bin, then 5120-byte regfile padded
          # with conv=sync, then u-boot.bin from offset 5184 onward.
          make hi3536c_config
          make CROSS_COMPILE=arm-hisiv600-linux- -j$(nproc)
          # mkboot.sh equivalent — inlined so we don't depend on
          # tools/pc/uboot_tools/ which isn't in the u-boot tree.
          dd if=./u-boot.bin    of=./fb1 bs=1    count=64    2>/dev/null
          dd if=./reg_info_${{ matrix.soc }}.bin of=./fb2 bs=5120 conv=sync 2>/dev/null
          dd if=./u-boot.bin    of=./fb3 bs=1    skip=5184   2>/dev/null
          cat fb1 fb2 fb3 > u-boot-${{ matrix.soc }}-universal.bin
          rm -f fb1 fb2 fb3

      - name: Check partition fit
        run: |
          # Boot partition is 256 KiB across every OpenIPC HiSi mtdparts
          # (hi-common.h / gk-common.h) regardless of IP-camera vs DVR
          # form factor. Same gate the rest of the fleet uses.
          FILE=u-boot-${{ matrix.soc }}-universal.bin
          LIMIT_KB=256
          SIZE_KB=$(($(stat -c %s "$FILE") / 1024))
          echo "- $FILE: [${SIZE_KB}KB/${LIMIT_KB}KB]"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "-- size exceeded by: $((SIZE_KB - LIMIT_KB))KB"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal
          path: u-boot-${{ matrix.soc }}-universal.bin

  qemu_smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { soc: hi3536cv100, machine: hi3536cv100 }
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Resolve qemu-hisilicon HEAD
        id: qemu-rev
        run: |
          sha=$(git ls-remote https://github.com/widgetii/qemu-hisilicon master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache qemu-system-arm
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: qemu-arm
          key: qemu-hisilicon-${{ steps.qemu-rev.outputs.sha }}

      - name: Build qemu-system-arm (cache miss)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master \
            https://github.com/widgetii/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal

      - name: Smoke-test in QEMU
        timeout-minutes: 2
        run: |
          UBOOT="$PWD/u-boot-${{ matrix.soc }}-universal.bin"
          test -f "$UBOOT"
          dd if=/dev/zero of=/tmp/flash.bin bs=1M count=8 2>/dev/null
          dd if="$UBOOT" of=/tmp/flash.bin bs=1 conv=notrunc 2>/dev/null
          mkfifo /tmp/uart.in /tmp/uart.out
          chmod +x ./qemu-arm
          ./qemu-arm \
            -M ${{ matrix.machine }},flash-file=/tmp/flash.bin \
            -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          timeout 10 cat /tmp/uart.out > /tmp/uboot.txt || true
          kill "$QEMU_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          if grep -qE 'U-Boot |Hit any key|CPU:|DRAM:|Board:|hisilicon #|OpenIPC #' /tmp/uboot.txt; then
            echo "PASS: u-boot booted past System startup"
          else
            echo "FAIL: u-boot did not get past System startup"
            tail -40 /tmp/qemu.log || true
            exit 1
          fi

  publish:
    needs: [build, qemu_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          for soc in hi3536cv100; do
            f="artifacts/u-boot-${soc}-universal/u-boot-${soc}-universal.bin"
            test -f "$f"
            upload "$f"
          done
